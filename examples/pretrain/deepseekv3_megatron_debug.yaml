### model
model_name_or_path: deepseek-ai/DeepSeek-V3-Base
config_name_or_path: /public/wangyiding/dsv3_megatron_config/deepseek_3bv3_megatron_like_config.json
trust_remote_code: true
train_from_scratch: true
flash_attn: fa2
moe_aux_loss_coef: 1.0e-4
disable_gradient_checkpointing: false

### method
stage: pt
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_offload_config.json

### dataset
dataset: c4_demo
cutoff_len: 512
packing: true
max_samples: 64
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: saves/deepseekv3_moe/full/pretrain_megatron_debug
logging_steps: 1
save_steps: 20
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 8.6e-4
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr: 7.0e-6
warmup_steps: 2
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
max_grad_norm: 1.0
bf16: true
fp16: false
ddp_timeout: 180000000
resume_from_checkpoint: null
max_steps: 2
