### model
model_name_or_path: deepseek-ai/DeepSeek-V3-Base
config_name_or_path: /public/wenweihuang/LLaMA-Factory/configs/deepseek_3bv3_megatron_like_config_deepspeed.json
trust_remote_code: true
train_from_scratch: true
flash_attn: fa2
moe_aux_loss_coef: 1.0e-4
enable_mtp: true
num_nextn_predict_layers: 1
mtp_loss_weight: 0.1
disable_gradient_checkpointing: false

### method
stage: pt
do_train: true
finetuning_type: full
# use_muon: true
deepspeed: examples/deepspeed/ds_z3_offload_config.json

### dataset
dataset: remix_olmo3_books_1T
cutoff_len: 4096
packing: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: saves/deepseekv3_moe/full/pretrain_megatron
logging_steps: 1
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 16
learning_rate: 8.6e-4
lr_scheduler_type: warmup_stable_decay
lr_scheduler_kwargs:
  decay_type: cosine
  num_decay_steps: 12000
  num_stable_steps: 46000
  min_lr_ratio: 8.13953488372093e-3
warmup_steps: 2000
num_train_epochs: 1.0
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
max_grad_norm: 1.0
bf16: true
fp16: false
ddp_timeout: 180000000
resume_from_checkpoint: null
